<!doctype html>
<html><head><meta charset="utf-8"><title>Super Station Studio</title><style>html,body{margin:0;width:100%;height:100%;background:#0b0f14;overflow:hidden}body{display:grid;place-items:center}.splash{width:100%;height:100%;display:grid;place-items:center;position:relative}.splash img{width:78%;max-height:72%;object-fit:contain;filter:drop-shadow(0 0 24px rgba(255,42,64,.18))}.pulse{position:absolute;bottom:34px;width:92px;height:3px;border-radius:3px;background:#252c35;overflow:hidden}.pulse:after{content:"";display:block;width:45%;height:100%;background:#ef3340;animation:load 1.15s ease-in-out infinite}@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}</style></head><body><div class="splash"><img src="logo-transparent.png" alt="Super Station Studio"><div class="pulse"></div></div></body></html>
